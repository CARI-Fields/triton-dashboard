openapi: 3.1.0
info:
  title: Triton Board Agent API
  version: 1.0.0
  description: |
    Safe, single-resource access for AI agents. The API has no delete or batch
    operation. PATCH is optimistic-concurrency protected; every data-creating
    POST is idempotent.
servers:
  - url: /api/agent/v1
    description: Exact Agent API base path. Set TRITON_BOARD_API_URL to the deployment origin plus this path.
security:
  - AgentApiKey: []
tags:
  - name: Discovery
  - name: Board reads
  - name: Tasks
  - name: Experiments
  - name: Attachments
  - name: Audit
paths:
  /templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      summary: List Experiment Templates.
      x-required-scope: board:read
      responses:
        "200":
          description: Template summaries.
  /templates/{id}:
    get:
      tags: [Templates]
      operationId: getTemplateSchema
      summary: Get one ordered Template schema.
      x-required-scope: board:read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ordered Fields, Keys, and options.
        "404":
          description: Template not found.
  /templates/{id}/compare:
    get:
      tags: [Templates]
      operationId: getTemplateCompareSource
      summary: Compare source rows for one Template.
      x-required-scope: board:read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: archived, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Experiments with typed Values.
  /experiments/{id}/values:
    patch:
      tags: [Experiments]
      operationId: patchExperimentValue
      summary: Patch one typed Value by stable key_id.
      x-required-scope: experiments:write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_id, expected_cell_revision]
              properties:
                key_id: { type: string, format: uuid }
                expected_cell_revision: { type: integer, minimum: 0 }
                value: { type: object, nullable: true }
      responses:
        "200":
          description: Saved Value.
        "409":
          description: Cell revision conflict; response includes remote.
  /experiments/{id}/archive:
    post:
      tags: [Experiments]
      operationId: archiveExperiment
      summary: Archive an Experiment (Required Values gate).
      x-required-scope: experiments:write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Archived.
        "422":
          description: Required Values missing.
  /experiments/{id}/unarchive:
    post:
      tags: [Experiments]
      operationId: unarchiveExperiment
      summary: Unarchive an Experiment.
      x-required-scope: experiments:write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Unarchived.
  /experiments/{id}/versions:
    get:
      tags: [Experiments]
      operationId: listExperimentVersions
      summary: List Experiment versions.
      x-required-scope: board:read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Versions.
  /experiments/{id}/versions/{versionNo}/restore:
    post:
      tags: [Experiments]
      operationId: restoreExperimentVersion
      summary: Restore a version as a new forward mutation.
      x-required-scope: experiments:write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: versionNo, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Restored.
  /capabilities:
    get:
      tags: [Discovery]
      operationId: getCapabilities
      summary: Inspect the authenticated Key identity, scopes, and fixed limits.
      description: Requires authentication but no scope.
      responses:
        "200":
          description: Current capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /board:
    get:
      tags: [Board reads]
      operationId: getBoardSummary
      summary: Get exact Board counts grouped by status.
      x-required-scope: board:read
      responses:
        "200":
          description: Board summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardSummarySuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /modules:
    get:
      tags: [Board reads]
      operationId: listModules
      summary: List all Modules in Board order.
      x-required-scope: board:read
      responses:
        "200":
          description: Module list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModulesSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /members:
    get:
      tags: [Board reads]
      operationId: listMembers
      summary: List all Members in Board order.
      x-required-scope: board:read
      responses:
        "200":
          description: Member list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: Filter and cursor-page Tasks.
      x-required-scope: board:read
      parameters:
        - $ref: "#/components/parameters/TaskModuleId"
        - $ref: "#/components/parameters/TaskAssigneeId"
        - $ref: "#/components/parameters/TaskStatus"
        - $ref: "#/components/parameters/UpdatedAfter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Descending updated_at/id page. Pass next_cursor unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPageSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get one Task and its assignee Member UUIDs.
      x-required-scope: board:read
      responses:
        "200":
          description: Task with a quoted updated_at ETag.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Tasks]
      operationId: patchTask
      summary: Apply a minimal Task field change.
      description: Requires the Key's Member to be assigned to the Task.
      x-required-scope: tasks:write
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatchEnvelope"
      responses:
        "200":
          description: Updated Task mutation DTO. Assignees are read via GET.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskMutationSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}/activity:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Tasks]
      operationId: listTaskActivity
      summary: List a Task's activity newest first.
      x-required-scope: board:read
      responses:
        "200":
          description: Activity list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitiesSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Tasks]
      operationId: appendTaskActivity
      summary: Append one comment Activity.
      description: Requires the Key's Member to be assigned to the Task.
      x-required-scope: activity:append
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreate"
      responses:
        "200":
          description: Idempotent replay of the original result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityReplayedSuccess"
        "201":
          description: Activity created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityCreatedSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /tasks/{id}/experiments:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Experiments]
      operationId: createTaskExperiment
      summary: Create a planned Experiment under one Task.
      description: |
        The body requires template_id and name; owner_id is optional and
        values is an optional map of typed Values keyed by stable key_id.
        The server fixes status to planned.
      x-required-scope: experiments:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id, name]
              additionalProperties: false
              properties:
                template_id: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 200 }
                owner_id: { type: string, format: uuid, nullable: true }
                values:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Idempotent replay of the original result.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentReplayedSuccess"
        "201":
          description: Experiment created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentCreatedSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /experiments:
    get:
      tags: [Experiments]
      operationId: listExperiments
      summary: Filter and cursor-page Experiments.
      x-required-scope: board:read
      parameters:
        - $ref: "#/components/parameters/ExperimentTaskId"
        - $ref: "#/components/parameters/ExperimentOwnerId"
        - $ref: "#/components/parameters/ExperimentStatus"
        - $ref: "#/components/parameters/UpdatedAfter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Descending updated_at/id page. Pass next_cursor unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentPageSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /experiments/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Experiments]
      operationId: getExperiment
      summary: Get an Experiment, Task/Owner display data, and Attachments.
      x-required-scope: board:read
      responses:
        "200":
          description: Experiment detail with a quoted updated_at ETag.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentDetailSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /experiments/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Attachments]
      operationId: createExperimentAttachment
      summary: Upload one image Attachment to an Experiment.
      description: |
        Requires collaboration on the parent Task. Accept exactly one file and
        at most one caption. Allowed file media types are image/png, image/jpeg,
        image/webp, and image/gif; size must be 1 byte through 10 MiB.
      x-required-scope: attachments:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AttachmentCreateForm"
            encoding:
              file:
                contentType: image/png, image/jpeg, image/webp, image/gif
      responses:
        "200":
          description: Idempotent replay of the original Attachment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentReplayedSuccess"
        "201":
          description: Attachment created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentCreatedSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /attachments/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags: [Attachments]
      operationId: patchAttachment
      summary: Replace one Attachment caption.
      description: Requires collaboration on the parent Task.
      x-required-scope: attachments:write
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentPatchEnvelope"
      responses:
        "200":
          description: Updated Attachment.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /audit:
    get:
      tags: [Audit]
      operationId: listAudit
      summary: List Agent API audit entries for currently collaborated Tasks.
      description: |
        Snapshots are allowlisted by resource type. Recovery uses before_state,
        then a fresh GET and an ordinary concurrency-safe PATCH.
      x-required-scope: audit:read
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    AgentApiKey:
      type: http
      scheme: bearer
      bearerFormat: Triton Board API Key
      description: Read TRITON_BOARD_API_KEY from the environment; never place it in a URL, body, or log.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact quoted RFC 3339 updated_at ETag from the latest GET.
      schema:
        $ref: "#/components/schemas/QuotedETag"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Canonical lowercase UUID. Reuse it for retries of the same logical POST;
        using it with a different method, path, body, caption, MIME, or file digest returns 409.
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    TaskModuleId:
      name: module_id
      in: query
      schema:
        $ref: "#/components/schemas/Uuid"
    TaskAssigneeId:
      name: assignee_id
      in: query
      schema:
        $ref: "#/components/schemas/Uuid"
    TaskStatus:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/TaskStatus"
    ExperimentTaskId:
      name: task_id
      in: query
      schema:
        $ref: "#/components/schemas/Uuid"
    ExperimentOwnerId:
      name: owner_id
      in: query
      schema:
        $ref: "#/components/schemas/Uuid"
    ExperimentStatus:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/ExperimentStatus"
    UpdatedAfter:
      name: updated_after
      in: query
      description: Strict RFC 3339 timestamp accepted by PostgreSQL timestamptz.
      schema:
        $ref: "#/components/schemas/Timestamp"
    Cursor:
      name: cursor
      in: query
      description: Opaque canonical base64url cursor returned as next_cursor.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    ETag:
      description: Quoted updated_at value to send unchanged as If-Match.
      schema:
        $ref: "#/components/schemas/QuotedETag"
    RetryAfter:
      description: Seconds to wait before considering a new write.
      schema:
        type: integer
        const: 60
  responses:
    BadRequest:
      description: Invalid query, UUID, JSON, request envelope, If-Match, Idempotency-Key, or multipart form.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, malformed, unknown, expired, revoked, or orphaned API Key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Missing scope or current Task collaboration.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: The Key already used this Idempotency-Key for a different normalized request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    VersionConflict:
      description: The resource changed after the ETag was read. GET and compare target fields before retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BodyTooLarge:
      description: A JSON request body exceeded 256 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: |
        Unknown, protected, invalid, empty, or workflow-invalid fields,
        including an unsupported, empty, or greater-than-10-MiB Attachment file.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: The Key reached 30 successful new writes in the preceding 60 seconds.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal or dependency failure. The error envelope never exposes backend secrets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    Timestamp:
      type: string
      format: date-time
      description: A real Gregorian date in server-supported years 0100 through 9999, with strict time and offset bounds.
      pattern: '^(?:(?:0[1-9]\d{2}|[1-9]\d{3})-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|02-(?:0[1-9]|1\d|2[0-8]))|(?:(?:0[48]|[2468][048]|[13579][26])00|(?:0[1-9]|[1-9]\d)(?:0[48]|[2468][048]|[13579][26]))-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d{1,9})?(?:Z|[+-](?:0\d|1[0-5]):[0-5]\d)$'
    QuotedETag:
      type: string
      description: The exact Timestamp grammar wrapped in one pair of double quotes.
      pattern: '^"(?:(?:0[1-9]\d{2}|[1-9]\d{3})-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|02-(?:0[1-9]|1\d|2[0-8]))|(?:(?:0[48]|[2468][048]|[13579][26])00|(?:0[1-9]|[1-9]\d)(?:0[48]|[2468][048]|[13579][26]))-02-29)T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d{1,9})?(?:Z|[+-](?:0\d|1[0-5]):[0-5]\d)"$'
    NullableTimestamp:
      oneOf:
        - $ref: "#/components/schemas/Timestamp"
        - type: "null"
    NullableUuid:
      oneOf:
        - $ref: "#/components/schemas/Uuid"
        - type: "null"
    DateOnly:
      type: string
      format: date
      description: A real Gregorian calendar date in server-supported years 0100 through 9999.
      pattern: '^(?:(?:0[1-9]\d{2}|[1-9]\d{3})-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|02-(?:0[1-9]|1\d|2[0-8]))|(?:(?:0[48]|[2468][048]|[13579][26])00|(?:0[1-9]|[1-9]\d)(?:0[48]|[2468][048]|[13579][26]))-02-29)$'
    NullableDateOnly:
